<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>n239</title>
<style>
  :root { --bg:#F8FAFC; --ink:#1E293B; --ink-soft:#64748B; --accent:#10B981; --hair:rgba(30,41,59,0.08); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .stage{max-width:520px;margin:0 auto;padding:96px 24px;}
  .eyebrow{font-size:11px;letter-spacing:2.4px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:14px;}
  h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:700;}
  p{font-size:15px;color:var(--ink-soft);margin:0 0 36px;}
  .app{display:flex;align-items:center;gap:14px;padding:16px 18px;background:white;border:0.5px solid var(--hair);border-radius:14px;text-decoration:none;color:inherit;}
  .app:hover{border-color:var(--accent);}
  .app img{width:44px;height:44px;border-radius:10px;}
  .app strong{display:block;font-size:15px;}
  .app span{font-size:13px;color:var(--ink-soft);}
  footer{margin-top:48px;font-size:13px;color:var(--ink-soft);}
  footer a{color:var(--ink-soft);}
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow">STUDIO</div>
  <h1>n239</h1>
  <p>做一些幫得上忙的小工具。</p>

  <a class="app" href="./glycowave/">
    <img src="./glycowave/assets/appicon.png" alt="Glycowave"/>
    <div>
      <strong>Glycowave</strong>
      <span>給外食族的 AI 飲食助手</span>
    </div>
  </a>

  <footer>
    有問題？來信 <a href="mailto:glycowave@n239.xyz">glycowave@n239.xyz</a>
  </footer>
</div>
</body>
</html>
